# Import rules are enforced by internal/architecture via go test ./...
version: 1
threshold:
  compliance: 100
  coverage: 100
dependenciesRules:
  - package: '^github\.com/AndrMoiseev/stepan/cmd/codex-appserver-probe$'
    shouldOnlyDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/codexprobe$'
  - package: '^github\.com/AndrMoiseev/stepan/cmd/stepan$'
    shouldOnlyDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/agentruntime$'
        - '^github\.com/AndrMoiseev/stepan/internal/agentruntime/claudeapp$'
        - '^github\.com/AndrMoiseev/stepan/internal/agentruntime/codexapp$'
        - '^github\.com/AndrMoiseev/stepan/internal/agentruntime/nessyapp$'
        - '^github\.com/AndrMoiseev/stepan/internal/flows/impl_loop$'
        - '^github\.com/AndrMoiseev/stepan/internal/flows/impl_loop/runtime$'
        - '^github\.com/AndrMoiseev/stepan/internal/platformsupport$'
        - '^github\.com/AndrMoiseev/stepan/internal/flows/spec$'
        - '^github\.com/AndrMoiseev/stepan/internal/flows/impl_loop/store$'
        - '^github\.com/AndrMoiseev/stepan/internal/setting$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/agentruntime$'
    shouldNotDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/.+$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/agentruntime/claudeapp$'
    shouldOnlyDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/agentruntime$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/agentruntime/codexapp$'
    shouldOnlyDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/agentruntime$'
        - '^github\.com/AndrMoiseev/stepan/internal/platformsupport$'
        - '^github\.com/AndrMoiseev/stepan/internal/processjob$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/agentruntime/nessyapp$'
    shouldOnlyDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/setting$'
        - '^github\.com/AndrMoiseev/stepan/internal/agentruntime$'
        - '^github\.com/AndrMoiseev/stepan/internal/platformsupport$'
        - '^github\.com/AndrMoiseev/stepan/internal/processjob$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/codexprobe$'
    shouldOnlyDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/agentruntime/codexapp$'
        - '^github\.com/AndrMoiseev/stepan/internal/git$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/flows/spec$'
    shouldOnlyDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/agentruntime$'
        - '^github\.com/AndrMoiseev/stepan/internal/git$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/flows/spec$'
    shouldNotDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/flows/impl_loop(?:/.+)?$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/flows/impl_loop$'
    shouldOnlyDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/agentruntime$'
        - '^github\.com/AndrMoiseev/stepan/internal/git$'
        - '^github\.com/AndrMoiseev/stepan/internal/processjob$'
        - '^github\.com/AndrMoiseev/stepan/internal/openspec$'
        - '^github\.com/AndrMoiseev/stepan/internal/flows/impl_loop/store$'
        - '^github\.com/AndrMoiseev/stepan/internal/flows/impl_loop/checkexec$'
        - '^github\.com/AndrMoiseev/stepan/internal/setting$'
        - '^github\.com/AndrMoiseev/stepan/internal/flows/impl_loop/state$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/flows/impl_loop$'
    shouldNotDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/flows/spec(?:/.+)?$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/openspec$'
    shouldOnlyDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/git$'
        - '^github\.com/AndrMoiseev/stepan/internal/processjob$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/flows/impl_loop/checkexec$'
    shouldOnlyDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/processjob$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/flows/impl_loop/store$'
    shouldOnlyDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/git$'
        - '^github\.com/AndrMoiseev/stepan/internal/processjob$'
        - '^github\.com/AndrMoiseev/stepan/internal/flows/impl_loop/state$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/openspec$'
    shouldNotDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/flows/(spec|impl_loop)(?:/.+)?$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/flows/impl_loop/store$'
    shouldNotDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/flows/spec(?:/.+)?$'
        - '^github\.com/AndrMoiseev/stepan/internal/flows/impl_loop$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/setting$'
    shouldNotDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/.+$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/flows/impl_loop/state$'
    shouldNotDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/.+$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/architecture$'
    shouldNotDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/.+$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/git$'
    shouldNotDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/.+$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/platformsupport$'
    shouldNotDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/.+$'
  - package: '^github\.com/AndrMoiseev/stepan/internal/processjob$'
    shouldNotDependsOn:
      internal:
        - '^github\.com/AndrMoiseev/stepan/internal/.+$'
