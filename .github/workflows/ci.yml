name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select integration suites
    runs-on: ubuntu-24.04
    outputs:
      git: ${{ steps.scope.outputs.git }}
      process: ${{ steps.scope.outputs.process }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -d '' changed < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
          fi
          go run ./internal/testscope/cmd -event "$EVENT_NAME" "${changed[@]}" >> "$GITHUB_OUTPUT"

  test-and-build:
    name: Fast test and build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-amd64
            goos: windows
            goarch: amd64
            binary: stepan.exe
            archive: dist/stepan-windows-amd64.zip
          - runner: macos-15
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            binary: stepan
            archive: dist/stepan-darwin-arm64.tar.gz

    env:
      CGO_ENABLED: "0"
      GOFLAGS: -mod=readonly

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify runner target
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = "$(go env GOOS)/$(go env GOARCH)"
          $expected = "${{ matrix.goos }}/${{ matrix.goarch }}"
          if ($actual -ne $expected) {
            throw "unexpected Go target: $actual; expected $expected"
          }
          go version

      - name: Verify runner target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(go env GOOS)/$(go env GOARCH)"
          expected="${{ matrix.goos }}/${{ matrix.goarch }}"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected Go target: %s; expected %s\n' "$actual" "$expected" >&2
            exit 1
          fi
          go version

      - name: Test
        run: go test -count=1 ./...

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o "${{ matrix.binary }}" ./cmd/stepan

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageRoot = "dist/${{ matrix.target }}"
          New-Item -ItemType Directory -Force $packageRoot | Out-Null
          Move-Item -LiteralPath "${{ matrix.binary }}" -Destination "$packageRoot/${{ matrix.binary }}"

          $hash = (Get-FileHash -Algorithm SHA256 "$packageRoot/${{ matrix.binary }}").Hash.ToLowerInvariant()
          "$hash  ${{ matrix.binary }}" | Set-Content -Encoding ascii "$packageRoot/SHA256SUMS"
          @(
            "commit=${{ github.sha }}"
            "go=$(go version)"
            "target=${{ matrix.goos }}/${{ matrix.goarch }}"
          ) | Set-Content -Encoding ascii "$packageRoot/BUILD-INFO.txt"

          Compress-Archive -LiteralPath $packageRoot -DestinationPath "${{ matrix.archive }}"

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          package_root="dist/${{ matrix.target }}"
          mkdir -p "$package_root"
          mv "${{ matrix.binary }}" "$package_root/${{ matrix.binary }}"
          chmod 0755 "$package_root/${{ matrix.binary }}"
          (
            cd "$package_root"
            shasum -a 256 "${{ matrix.binary }}" > SHA256SUMS
            printf 'commit=%s\ngo=%s\ntarget=%s/%s\n' \
              '${{ github.sha }}' "$(go version)" '${{ matrix.goos }}' '${{ matrix.goarch }}' \
              > BUILD-INFO.txt
          )
          archive="$PWD/${{ matrix.archive }}"
          tar -C dist -czf "$archive" "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: stepan-${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30
          archive: false

  git-integration:
    name: Git integration (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.git == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-amd64
          - runner: macos-15
            target: darwin-arm64

    env:
      CGO_ENABLED: "0"
      GOFLAGS: -mod=readonly

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run Git integration tests
        run: go test -count=1 -parallel=4 -tags=git_integration ./...

  process-integration:
    name: Process integration (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.process == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-amd64
          - runner: macos-15
            target: darwin-arm64

    env:
      CGO_ENABLED: "0"
      GOFLAGS: -mod=readonly

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run process integration tests
        run: go test -count=1 -tags=process_integration ./...
